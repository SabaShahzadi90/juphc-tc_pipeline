apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-install
spec:
  steps:
    - name: npm-install
      image: node:18
      script: |
        #!/usr/bin/env bash
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: run-jasmine-tests
spec:
  steps:
    - name: run-tests
      image: node:18
      script: |
        #!/usr/bin/env bash
        npm test
